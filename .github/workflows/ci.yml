name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install ffmpeg
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ffmpeg; else sudo apt-get update && sudo apt-get install -y ffmpeg; fi

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check fbreels tests

      - name: Unit & API tests
        run: pytest -q

      - name: App starts and serves the UI
        run: |
          python -m fbreels.web --no-browser --port 8799 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8799/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8799/ | grep -q Vidstash
          curl -sf http://127.0.0.1:8799/api/system | python -c "import sys, json; d = json.load(sys.stdin); assert d['ffmpeg'], d; print(d['ytdlp'])"
